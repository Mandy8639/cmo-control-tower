[project]
name = "control-tower"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "formulas>=1.3.4",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.scripts]
ct = "control_tower.cli:main"

[tool.ruff]
line-length = 175
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
